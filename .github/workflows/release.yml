name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app:
    runs-on: xcode-27
    permissions:
      contents: write
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.AC_API_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          [ "$(git describe --tags --exact-match --match 'v[0-9]*.[0-9]*.[0-9]*')" = "$GITHUB_REF_NAME" ]

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        run: |
          set -euo pipefail
          make web
          make test
          (cd web && npm test)
          swift test --package-path app

      - name: Check signing secrets
        run: |
          if [ "$HAS_SIGNING" != "$HAS_NOTARY" ]; then
            echo "::error::set both the signing and the notarization secrets, or neither"
            exit 1
          fi

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/kubit-signing.keychain-db"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          echo "$P12" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PW" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Build
        env:
          KUBIT_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            hack/build-app.sh release
          else
            KUBIT_VERSION=0.0.0 hack/build-app.sh local
          fi

      - name: Notarize
        if: env.HAS_NOTARY == 'true'
        env:
          KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          ISSUER: ${{ secrets.AC_API_ISSUER_ID }}
          KEY_B64: ${{ secrets.AC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEY_B64" | base64 --decode >"$RUNNER_TEMP/ac.p8"
          zip=$(ls dist/Kubit-*-macos-universal.zip)
          result=$(xcrun notarytool submit "$zip" --key "$RUNNER_TEMP/ac.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --wait --output-format json)
          echo "$result"
          if [ "$(echo "$result" | jq -r .status)" != Accepted ]; then
            xcrun notarytool log "$(echo "$result" | jq -r .id)" --key "$RUNNER_TEMP/ac.p8" --key-id "$KEY_ID" --issuer "$ISSUER" || true
            exit 1
          fi
          rm -f "$RUNNER_TEMP/ac.p8"
          xcrun stapler staple dist/Kubit.app
          xcrun stapler validate dist/Kubit.app
          spctl -a -vv -t exec dist/Kubit.app
          rm -f "$zip"
          ditto -c -k --keepParent dist/Kubit.app "$zip"

      - name: Sign the update
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_KEY: ${{ secrets.KUBIT_RELEASE_KEY }}
        run: |
          set -euo pipefail
          zip=$(ls dist/Kubit-*-macos-universal.zip)
          go run ./hack/release-sign sign "$zip"
          go run ./hack/release-sign verify "$zip" "$(cat app/release.pub)"
          (cd dist && shasum -a 256 Kubit-*.zip Kubit-*.zip.sig >SHA256SUMS)
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" >dist/notes.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kubit-app
          path: dist/Kubit-*
          retention-days: 7

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: dist/notes.md
          files: |
            dist/Kubit-*-macos-universal.zip
            dist/Kubit-*-macos-universal.zip.sig
            dist/SHA256SUMS
          fail_on_unmatched_files: true
