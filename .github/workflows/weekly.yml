name: Weekly dependency release

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      ship:
        description: Tag and release when validation passes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      legs: ${{ steps.bump.outputs.legs }}
      base_sha: ${{ steps.bump.outputs.base_sha }}
      latest_sha: ${{ steps.bump.outputs.latest_sha }}
      latest_version: ${{ steps.bump.outputs.latest_version }}
      safe_sha: ${{ steps.bump.outputs.safe_sha }}
      safe_version: ${{ steps.bump.outputs.safe_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Update dependencies
        id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          echo "base_sha=$base" >>"$GITHUB_OUTPUT"
          last=$(git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then
            echo "::warning::Tag v0.1.0 first."
            last=v0.0.0
          fi
          git config user.name kubit-bot
          git config user.email actions@users.noreply.github.com
          bump() {
            local leg=$1 dir=out/$1 ma mi pa next
            if [ -s "$dir/changes.tsv" ] && ! git diff --quiet; then
              IFS=. read -r ma mi pa <<<"${last#v}"
              if cut -f4 "$dir/changes.tsv" | grep -qxE 'minor|major'; then
                next="$ma.$((mi + 1)).0"
              else
                next="$ma.$mi.$((pa + 1))"
              fi
              {
                echo "Kubit $next"
                echo
                echo "| Component | From | To | Kind |"
                echo "| --- | --- | --- | --- |"
                awk -F'\t' '{printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4}' "$dir/changes.tsv"
              } >"$dir/notes.md"
              {
                cat "$dir/notes.md"
                echo
                awk -F'\t' '{printf "Bump: %s %s %s\n", $1, $2, $3}' "$dir/changes.tsv"
              } >"$dir/message.txt"
              git add -A
              git commit -q -F "$dir/message.txt"
              git branch -f "weekly-$leg" HEAD
              echo "${leg}_sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
              echo "${leg}_version=$next" >>"$GITHUB_OUTPUT"
            fi
            git reset -q --hard "$base"
            git clean -fdq
          }
          DEPS_MAJORS=1 DEPS_OUT=out/latest hack/deps.sh
          bump latest
          DEPS_OUT=out/safe hack/deps.sh
          bump safe
          legs=()
          git rev-parse -q --verify weekly-latest >/dev/null && legs+=(latest)
          if git rev-parse -q --verify weekly-safe >/dev/null && ! cmp -s out/latest/changes.tsv out/safe/changes.tsv; then
            legs+=(safe)
          fi
          if [ ${#legs[@]} -eq 0 ]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "legs=[]" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git bundle create out/bump.bundle "${legs[@]/#/weekly-}" "^$base"
          echo "changed=true" >>"$GITHUB_OUTPUT"
          echo "legs=$(printf '%s\n' "${legs[@]}" | jq -Rnc '[inputs]')" >>"$GITHUB_OUTPUT"
          for leg in "${legs[@]}"; do
            { echo "## $leg"; echo; cat "out/$leg/notes.md"; echo; } >>"$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weekly
          path: out/
          retention-days: 7

  validate:
    name: validate ${{ matrix.leg }}
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.prepare.outputs.legs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weekly
          path: out

      - name: Check out the bump
        env:
          BUMP_SHA: ${{ needs.prepare.outputs[format('{0}_sha', matrix.leg)] }}
        run: |
          set -euo pipefail
          git fetch -q out/bump.bundle "$BUMP_SHA"
          git checkout -q "$BUMP_SHA"
          [ "$(git rev-parse HEAD)" = "$BUMP_SHA" ]

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Build and test
        run: |
          set -euo pipefail
          make build
          make test
          (cd web && npm test)
          go test -tags integration ./internal/tofu/...
          swift test --package-path app
          hack/build-app.sh local
          lipo -archs dist/Kubit.app/Contents/MacOS/KubitApp && lipo -archs dist/Kubit.app/Contents/Resources/bin/kubit
          dist/Kubit.app/Contents/Resources/bin/kubit version
          mkdir -p passed && echo "${{ matrix.leg }}" >"passed/${{ matrix.leg }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: passed-${{ matrix.leg }}
          path: passed/
          retention-days: 7

  choose:
    name: choose
    needs: [prepare, validate]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      leg: ${{ steps.pick.outputs.leg }}
      sha: ${{ steps.pick.outputs.sha }}
      version: ${{ steps.pick.outputs.version }}
      review_leg: ${{ steps.pick.outputs.review_leg }}
      review_changed: ${{ steps.pick.outputs.review_changed }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weekly
          path: out

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.prepare.outputs.changed == 'true'
        continue-on-error: true
        with:
          pattern: passed-*
          path: passed
          merge-multiple: true

      - name: Pick the newest passing bump
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ needs.prepare.outputs.changed }}
          LATEST_SHA: ${{ needs.prepare.outputs.latest_sha }}
          LATEST_VERSION: ${{ needs.prepare.outputs.latest_version }}
          SAFE_SHA: ${{ needs.prepare.outputs.safe_sha }}
          SAFE_VERSION: ${{ needs.prepare.outputs.safe_version }}
        run: |
          set -euo pipefail
          leg=""
          if [ -f passed/latest ]; then
            leg=latest
            echo "sha=$LATEST_SHA" >>"$GITHUB_OUTPUT"
            echo "version=$LATEST_VERSION" >>"$GITHUB_OUTPUT"
          elif [ -f passed/safe ]; then
            leg=safe
            echo "sha=$SAFE_SHA" >>"$GITHUB_OUTPUT"
            echo "version=$SAFE_VERSION" >>"$GITHUB_OUTPUT"
          fi
          echo "leg=$leg" >>"$GITHUB_OUTPUT"
          if [ "$CHANGED" != true ] || [ "$leg" = latest ]; then review_leg=latest; else review_leg=safe; fi
          echo "review_leg=$review_leg" >>"$GITHUB_OUTPUT"
          list="out/$review_leg/review.tsv"
          hash=$(shasum -a 256 "$list" | cut -c1-16)
          body=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Dependency review"' --json body --jq '.[0].body // ""')
          if [ -s "$list" ] && ! grep -q "review:$hash" <<<"$body"; then
            echo "review_changed=true" >>"$GITHUB_OUTPUT"
          elif [ ! -s "$list" ] && [ -n "$body" ]; then
            echo "review_changed=true" >>"$GITHUB_OUTPUT"
          else
            echo "review_changed=false" >>"$GITHUB_OUTPUT"
          fi
          echo "Shipping: ${leg:-nothing}" >>"$GITHUB_STEP_SUMMARY"

  ship:
    name: ship
    needs: [prepare, choose]
    if: >-
      always() &&
      needs.choose.outputs.leg != '' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || inputs.ship)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.AUTOMATION_SSH_KEY }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weekly
          path: out

      - name: Tag and push
        env:
          BUMP_SHA: ${{ needs.choose.outputs.sha }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          VERSION: ${{ needs.choose.outputs.version }}
          LEG: ${{ needs.choose.outputs.leg }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --merged "$BASE_SHA" | grep -q . || { echo "::error::Tag v0.1.0 first."; exit 1; }
          git fetch -q out/bump.bundle "$BUMP_SHA"
          [ "$(git rev-parse "$BUMP_SHA^{commit}")" = "$BUMP_SHA" ]
          [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA" ] || { echo "::error::main moved during the run"; exit 1; }
          git config user.name kubit-bot
          git config user.email actions@users.noreply.github.com
          git tag -a "v$VERSION" -F "out/$LEG/notes.md" "$BUMP_SHA"
          git push origin "v$VERSION"
          git push origin "$BUMP_SHA:refs/heads/main"
          for _ in $(seq 1 10); do
            if gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "v$VERSION" --json databaseId --jq '.[0].databaseId' | grep -q .; then
              echo "Release run started for v$VERSION" >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done
          echo "::error::no release run started for v$VERSION"
          exit 1

  review:
    name: review
    needs: [prepare, choose]
    if: always() && needs.choose.outputs.review_changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weekly
          path: out

      - name: Update the review issue
        env:
          GH_TOKEN: ${{ github.token }}
          LIST: out/${{ needs.choose.outputs.review_leg }}/review.tsv
          MAJORS_FAILED: ${{ needs.choose.outputs.review_leg == 'safe' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Dependency review"' --json number --jq '.[0].number // ""')
          if [ ! -s "$LIST" ]; then
            [ -n "$number" ] && gh issue close "$number" --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          hash=$(shasum -a 256 "$LIST" | cut -c1-16)
          {
            if [ "$MAJORS_FAILED" = true ]; then
              echo "Validation failed with every update applied: $RUN_URL"
              echo
            fi
            echo "| Component | Current | Available | Kind |"
            echo "| --- | --- | --- | --- |"
            awk -F'\t' '{printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4}' "$LIST"
            echo
            echo "<!-- review:$hash -->"
          } >out/review.md
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file out/review.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Dependency review" --body-file out/review.md
          fi

  prune:
    name: prune
    needs: [prepare, validate, choose, ship, review]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete earlier empty runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/weekly.yml/runs?status=success&per_page=50" --jq '.workflow_runs[].id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            ran=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[] | select((.name | startswith("validate")) or .name == "ship" or .name == "review") | select(.conclusion != "skipped")] | length')
            if [ "$ran" = 0 ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id"
              echo "deleted run $id"
            fi
          done
