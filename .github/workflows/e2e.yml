name: e2e

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf dnsmasq-base jq
          curl -fsSL -o kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install kubectl /usr/local/bin/kubectl
          ls -l /dev/kvm && sudo chmod 666 /dev/kvm
      - name: Build
        run: |
          (cd web && npm ci && npm run build)
          go build -o bin/kubit ./cmd/kubit
      - name: Lab
        run: |
          hack/qemu/lab.sh net up
          hack/qemu/lab.sh iso
          for n in 1 2 3 4; do hack/qemu/lab.sh create $n 2 2560 20 && hack/qemu/lab.sh start $n; done
          for n in 1 2 3 4; do hack/qemu/lab.sh wait $n 420; done
          hack/qemu/lab.sh list
      - name: Daemon
        run: |
          export KUBIT_HOME=$RUNNER_TEMP/kubit KUBIT_MASTER_KEY=$(head -c 32 /dev/urandom | base64)
          nohup ./bin/kubit serve --addr 127.0.0.1:8080 > $RUNNER_TEMP/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/v1/version && break; sleep 1; done
      - name: End to end
        run: hack/e2e.sh 192.168.105.0/24 --name e2e --with-restore
      - name: Logs
        if: always()
        run: |
          echo "::group::daemon"; cat $RUNNER_TEMP/serve.log || true; echo "::endgroup::"
          for d in hack/qemu/state/vm*; do echo "::group::${d##*/} console"; tail -100 $d/console.log || true; echo "::endgroup::"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: |
            ${{ runner.temp }}/serve.log
            hack/qemu/state/vm*/console.log
            hack/qemu/state/dnsmasq.log
