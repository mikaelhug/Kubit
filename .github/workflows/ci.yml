name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Web
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm run build
      - name: Format
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -ldflags "-X main.version=${GITHUB_SHA::7}" -o bin/kubit ./cmd/kubit
      - name: Smoke
        run: |
          export KUBIT_HOME=$RUNNER_TEMP/kubit KUBIT_MASTER_KEY=$(head -c 32 /dev/urandom | base64)
          ./bin/kubit serve --addr 127.0.0.1:8080 > $RUNNER_TEMP/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/v1/version && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/api/v1/auth/me | grep -q '"setup":true'
          curl -sf http://127.0.0.1:8080/api/v1/clusters
      - uses: actions/upload-artifact@v4
        with:
          name: kubit-linux-amd64
          path: bin/kubit
